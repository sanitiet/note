<ul><li>图上标「除尘器」在前、「节能器」在后、「布袋」再后，和常见的「旋风→省煤器→布袋」一致，顺序正常。</li><li>脱硝位置在锅炉出口高温区，符合 SNCR 的温度要求；标「SCR」但未见图块级催化剂，倾向按 SNCR 理解。</li></ul>
<p><b>更正（2026-11-16 现场核实）</b>：实际顺序是</p>
<p>锅炉 → 多管除尘器 → <b>脱硝器（SCR，内含球状固体催化剂）</b> → 省煤器 → 布袋除尘器 → 空气预热器 → 脱硫塔（水膜除尘）→ 烟囱</p>
<p>脱硝不是单独一段 SNCR 喷氨，而是 <b>SNCR（炉膛喷尿素）+ SCR（除尘后反应器）联用</b>。</p>
