<div class="top"><span>压力管道基础</span><a href="index.html">目录</a></div>
<p>烟气流程：炉膛 → 过热器 → <b>省煤器 → 空预器</b> → 除尘脱硫 → 烟囱。</p>
<p>空预器在最后，冷风进口那一侧壁温最低（冬天可能只有 60～80℃），低于酸露点，酸在<b>烟气侧的管壁</b>上凝出来，烂的是管口和管板，但位置靠近进风口那一端。</p>
<p>一句话：<b>烂在冷风那一头，坏在烟气那一面。</b></p>
