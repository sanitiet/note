<ul><li><b>给水溶氧</b>：除氧器好不好，看它。超标 → 省煤器和给水管点蚀。</li><li><b>锅水磷酸根</b>：在 10～30 mg/L 之间最好。长期接近 0 → 结垢和碱脆没人管。</li><li><b>总铁</b>：看<b>趋势</b>不看单点。忽然往上抬，说明腐蚀在加剧（氧或 pH）。</li></ul>
<p>⚠️ 单位坑：化验单报的「总磷」若以 <b>P</b> 计，换成磷酸根要<b>乘 3.06</b>；直接拿去对 10～30 mg/L 会误判。</p>
