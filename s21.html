<ul><li><b>1 MPa = 10⁶ Pa（一百万帕）</b>，也就是 1 兆帕。</li><li>换算：1 MPa ≈ 10 bar ≈ 10.2 kgf/cm²。</li><li>锅炉说的「0.8 兆帕」＝8 bar 左右，也就是每平方厘米扛 8 公斤。</li><li>表压和绝对压力差一个大气压（0.1 MPa）。锅炉上标的基本都是<b>表压</b>。</li></ul>
<p>一句话：<b>MPa 是「每平方米多少头牛」，数值大是因为面积大，不是压力真的有那么玄。</b></p>
