<h2>6 屈服强度 σs 与抗拉强度 σb</h2>
<p>拉伸曲线四段：<b>弹性段</b> → <b>屈服</b>（开始留永久变形）→ <b>强化</b> → <b>颈缩断裂</b>。</p>
<table>
<tr><th>指标</th><th>含义</th><th>用在哪</th></tr>
<tr><td>σs 屈服强度</td><td>开始产生永久变形的应力</td><td>算壁厚（日常不允许变形）；再除安全系数</td></tr>
<tr><td>σb 抗拉强度</td><td>能承受的最大应力（曲线最高点）</td><td>判爆破、算极限余量</td></tr>
</table>
<p>σb 恒大于 σs（低碳钢约 1.5 倍）。</p>
<div class="tip"><b>经验换算</b>：σb(MPa) ≈ 3.4 × HB（只对钢、只用布氏硬度；薄壁件打不了布氏）</div>
