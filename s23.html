<ol><li><b>除氧</b>（主力）：把水加热到除氧器压力下的饱和温度（0.02 MPa 约 104℃），氧溶解度骤降，靠排汽带走。出水溶氧能从 8 mg/L 降到 μg/L 级。</li><li><b>加药</b>（补刀）：残余氧用亚硫酸钠（或联氨）收掉；磷酸三钠防垢、抑碱脆；片碱提 pH。</li><li><b>排污</b>（兜底）：溶解固形物、碱度靠排污控制，不是靠加药。</li></ol>
<p><b>三者的关系</b>：除氧是主力，加药是补漏，排污是清账。缺一个都不至于立刻出事，但缺久了都记账。</p>
