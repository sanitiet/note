<h2>5 为什么最后只看环向</h2>
<p><b>算例</b>：Φ273×8，内压 1.6 MPa</p>
<table>
<tr><th>方向</th><th>数值</th><th>占比</th></tr>
<tr><td>环向</td><td>27.3 MPa</td><td>主控</td></tr>
<tr><td>轴向</td><td>13.7 MPa</td><td>环向的 1/2</td></tr>
<tr><td>径向</td><td>1.6 MPa</td><td>环向的 1/17</td></tr>
</table>
<p>结论：<b>壁厚由环向定</b>；径向差一个数量级可忽略；轴向不单独定壁厚，但它造成"双轴受力"，会让材料比单向受力更早失效——设计裕度里已经含它。</p>
