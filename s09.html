<h2>9 容易踩的坑</h2>
<div class="warn">
<p>1. <b>单位</b>：D 和 t 都用 mm、p 用 MPa，直接算就是 MPa，不用换算。<br>
2. <b>δ 跨标距比</b>：δ₅ 不能跟 δ₁₀ 比，报数必须带下标。<br>
3. <b>径向不算"零"</b>：内壁是 −p，只是比环向小一个数量级。<br>
4. <b>轴向别忘了封头</b>：敞口就没有轴向应力，"有没有承压端面"才是判据。<br>
5. <b>厚壁别用薄壁公式</b>：t/D 大了，薄壁公式会低估内壁应力。</p>
</div>
