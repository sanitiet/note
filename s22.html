<ul><li><b>碳钢</b>（20#、Q245R、20G）：常温到 450℃ 好使。锅炉本体、水冷壁、省煤器基本都是它。</li><li><b>合金钢</b>（12Cr1MoV、T91）：450℃ 以上到 600℃ 左右，过热器高温段用。</li><li><b>奥氏体钢</b>（304、316、347H）：面心立方组织，没磁性、塑性好、低温韧性也好，靠冷加工强化，不能淬火。耐蚀、耐高温，最贵。</li></ul>
<p>一句话：<b>选材看温度和介质，不看「是不是锅炉」。</b></p>
