<p><b>推导</b>：封头面积 πD²/4 被内压顶 → 力 = p·πD²/4；管壁环形截面 ≈ πD·t 顶着 → 相等后约掉 πD。</p>
<p>σ_轴向 = pD / (4t)　（正好是环向的一半）</p>
<div class="f"></div>
<p><b>什么时候有</b>：只有承压的端面才有轴向应力（两端封死、一端封死由夹具承担都算）；<b>两端敞开</b>则基本为 0。</p>
<p><b>为什么是 1/2</b>：环向扛的是"直径×长度"那么大一块投影面积，轴向只扛封头那个圆。</p>
