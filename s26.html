<div class="top"><span>压力管道基础</span><a href="index.html">目录</a></div>
<ul><li>煤里的硫烧成 SO₂，其中约 1～2% 被飞灰里的铁、钒催化成 <b>SO₃</b>。</li><li>SO₃ 吸水变硫酸蒸气，<b>露点抬到 120～150℃</b>（硫越高越高）。</li><li>只要<b>壁面温度</b>低于露点，就结酸液膜——<b>腐蚀看壁温，不看烟温</b>。</li><li>对策：预热冷风（暖风器）、低氧燃烧、冷端用 ND 钢或搪瓷管、按时吹灰。</li></ul>
