<p>δ₅ = (断后标距 − 原标距) / 原标距 × 100%</p>
<div class="f"></div>
<p>ψ  = (原截面积 − 断口截面积) / 原截面积 × 100%</p>
<div class="f"></div>
<p><b>下标 5 的意义</b>：标距长度取试样直径的 5 倍（如 d=10 → 标距 50 mm）。取 10 倍就是 δ₁₀。<b>标距越短，数值越高，所以两个数不能互比。</b></p>
<table><tr><th>材料</th><th>δ₅</th><th>ψ</th></tr><tr><td>低碳钢（典型）</td><td>25～30%</td><td>50～60%</td></tr></table>
<p><b>为什么关心</b>：强度说"能扛多少"，塑性说"扛不住时是变形还是脆断"。管道、焊缝最怕脆断（无预兆）。弯管、卷板这类成形工序，塑性优先于强度。</p>
