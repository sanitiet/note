<h2>1 应力：一切的起点</h2>
<div class="f">σ = F / A</div>
<p><b>面积取哪块</b>：垂直于力方向切开的材料截面，不是表面积、不是中空部分。</p>
<p><b>单位</b>：MPa = N/mm²。用 mm 和 N 直接算，出来的就是 MPa，不用换算。</p>
<div class="tip"><b>例子</b>：80 kg 站在 300 cm² 上 → 约 2.6 N/cm²；换成 1 cm² 的高跟鞋跟 → 780 N/cm²，差 300 倍。力没变，只有面积变了。</div>
